[package]
name = "letopis-publication-checks"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
letopis-storage-build = { path = "../storage-build" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "load_extension"] }
libc = "=0.2.191"
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
tempfile = "=3.23.0"
