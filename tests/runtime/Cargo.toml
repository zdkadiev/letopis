[package]
name = "letopis-runtime-checks"
version = "0.0.0"
edition = "2024"
publish = false
[dependencies]
letopis-publication-checks = { path = "../publication" }
letopis-embedding-checks = { path = "../embedding" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "load_extension"] }
libc = "=0.2.191"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
[dev-dependencies]
tempfile = "=3.23.0"
[[bin]]
name = "publisher"
path = "../publication/src/bin/publisher.rs"
[[bin]]
name = "embedder"
path = "../embedding/src/bin/embedder.rs"
