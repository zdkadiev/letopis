name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare native toolchain and strict test oracle
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install coreutils
            export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y build-essential curl xz-utils zlib1g-dev python3
          fi
          sudo env PATH="$PATH" sh tests/git/install-oracle.sh
          echo /opt/git-oracle/bin >> "$GITHUB_PATH"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --component rust-docs
          rustup default 1.95.0
          python3 --version
          test "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
          cargo fetch --locked
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('tag does not match package version')
          PY
      - name: Verify native product and package tooling
        run: |
          python3 -B -m unittest discover -s tests/release -p 'test_*.py' -v
          python3 -B tests/storage/run.py --platform host --evidence .artifacts/release/native
      - name: Build, package and test the extracted executable
        run: |
          make release
          python3 -B scripts/release.py package --binary target/dist/letopis --target '${{ matrix.target }}' --output .artifacts/release/packages
          mkdir -p .artifacts/release/extracted
          tar -xzf .artifacts/release/packages/*.tar.gz -C .artifacts/release/extracted
          python3 -B scripts/release.py smoke --binary .artifacts/release/extracted/letopis
          if [ "$RUNNER_OS" = macOS ]; then
            otool -L .artifacts/release/extracted/letopis
          else
            ldd .artifacts/release/extracted/letopis
          fi > .artifacts/release/package-linkage.txt
          if grep -Ei 'lib(sqlite|vec1)' .artifacts/release/package-linkage.txt; then
            echo 'Unexpected external SQLite/vector library' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.target }}
          path: .artifacts/release/packages/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ matrix.target }}
          path: |
            .artifacts/release/native/
            .artifacts/release/package-linkage.txt
          if-no-files-found: warn
