{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:letopis:contracts:cli:v1",
  "title": "letopis v1 CLI JSON payload catalogue",
  "x-boundary": "X-1",
  "x-direction": "published",
  "x-status": "draft",
  "x-serves": [
    "FR-1",
    "FR-2",
    "FR-3",
    "FR-4",
    "FR-5",
    "FR-6",
    "FR-11",
    "FR-12",
    "FR-13",
    "FR-17",
    "FR-18",
    "FR-19",
    "FR-20",
    "FR-21",
    "FR-22",
    "FR-23",
    "FR-24",
    "FR-25",
    "FR-26",
    "FR-27",
    "FR-28",
    "FR-29",
    "FR-30",
    "FR-31",
    "FR-32",
    "FR-33",
    "FR-34",
    "FR-35",
    "FR-36",
    "C-1"
  ],
  "x-limits": [],
  "$defs": {
    "Hash": {
      "type": "string",
      "pattern": "^[0-9a-f]{64}(?![\\s\\S])",
      "minLength": 64,
      "maxLength": 64
    },
    "OID": {
      "type": "string",
      "pattern": "^(?:[0-9a-f]{40}|[0-9a-f]{64})(?![\\s\\S])"
    },
    "Text": {
      "type": "string",
      "minLength": 1
    },
    "Path": {
      "type": "string",
      "minLength": 1,
      "pattern": "^(?!/)[^\\x00]+(?![\\s\\S])"
    },
    "Empty": {
      "type": "object",
      "properties": {},
      "required": [],
      "additionalProperties": false
    },
    "Lines": {
      "type": "array",
      "prefixItems": [
        {
          "type": "integer",
          "minimum": 1
        },
        {
          "type": "integer",
          "minimum": 1
        }
      ],
      "minItems": 2,
      "maxItems": 2,
      "description": "1-based inclusive; application also checks end >= start."
    },
    "Flags": {
      "type": "array",
      "items": {
        "enum": [
          "stale",
          "source_changed",
          "source_not_found"
        ]
      },
      "uniqueItems": true
    },
    "Link": {
      "type": "object",
      "properties": {
        "element_id": {
          "$ref": "#/$defs/ElementId"
        },
        "path": {
          "$ref": "#/$defs/Path"
        },
        "lines": {
          "$ref": "#/$defs/Lines"
        },
        "revision": {
          "$ref": "#/$defs/Revision"
        },
        "flags": {
          "$ref": "#/$defs/Flags"
        }
      },
      "required": [
        "element_id",
        "path",
        "revision",
        "flags"
      ],
      "additionalProperties": false
    },
    "Diagnostic": {
      "type": "object",
      "properties": {
        "code": {
          "enum": [
            "invalid_request",
            "not_found",
            "validation_failed",
            "embedding_failed",
            "internal_error",
            "cancelled"
          ]
        },
        "message": {
          "$ref": "#/$defs/Text"
        },
        "details": {
          "type": "object"
        }
      },
      "required": [
        "code",
        "message",
        "details"
      ],
      "additionalProperties": false
    },
    "Failure": {
      "type": "object",
      "properties": {
        "ok": {
          "const": false
        },
        "error": {
          "$ref": "#/$defs/Diagnostic"
        }
      },
      "required": [
        "ok",
        "error"
      ],
      "additionalProperties": false
    },
    "CheckOutput": {
      "type": "object",
      "properties": {
        "ok": {
          "const": true
        },
        "result": {
          "type": "object",
          "properties": {
            "errors": {
              "type": "array",
              "items": {
                "$ref": "#/$defs/Diagnostic"
              },
              "minItems": 0
            }
          },
          "required": [
            "errors"
          ],
          "additionalProperties": false
        },
        "warnings": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Diagnostic"
          },
          "minItems": 1,
          "description": "D-95: non-fatal warnings of this call (drain not started); not stored. The last query-embedding error is a status problem (D-62)."
        }
      },
      "required": [
        "ok",
        "result"
      ],
      "additionalProperties": false,
      "description": "Validation findings of the checked files: markup, duplicate anchors, nested elements, dangling links, includes cycles, missing created_at/source_snapshot problems. Empty list = valid."
    },
    "InspectInput": {
      "type": "object",
      "properties": {
        "element_ids": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/ElementId"
          },
          "minItems": 1
        }
      },
      "required": [
        "element_ids"
      ],
      "additionalProperties": false,
      "description": "Batch IDs may address knowledge elements and sources. Unknown current ID rejects the entire batch."
    },
    "Inspected": {
      "type": "object",
      "properties": {
        "path": {
          "$ref": "#/$defs/Path"
        },
        "lines": {
          "$ref": "#/$defs/Lines"
        },
        "hash": {
          "anyOf": [
            {
              "$ref": "#/$defs/Hash"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "path",
        "hash"
      ],
      "additionalProperties": false,
      "description": "Metadata from the common canonical snapshot; hash is the element's (or addressed source bytes') SHA-256, null for an unavailable source."
    },
    "InspectOutput": {
      "type": "object",
      "properties": {
        "ok": {
          "const": true
        },
        "result": {
          "type": "object",
          "properties": {
            "snapshot": {
              "$ref": "#/$defs/OID"
            },
            "elements": {
              "type": "object",
              "propertyNames": {
                "type": "string"
              },
              "additionalProperties": {
                "$ref": "#/$defs/Inspected"
              },
              "description": "Keys are ElementId values (KnowledgeId or SourceId); propertyNames cannot use anyOf of patterns portably, so the application checks them."
            }
          },
          "required": [
            "snapshot",
            "elements"
          ],
          "additionalProperties": false
        },
        "warnings": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Diagnostic"
          },
          "minItems": 1,
          "description": "D-95: non-fatal warnings of this call (drain not started); not stored. The last query-embedding error is a status problem (D-62)."
        }
      },
      "required": [
        "ok",
        "result"
      ],
      "additionalProperties": false
    },
    "Filters": {
      "type": "object",
      "properties": {
        "needs_recheck": {
          "type": "boolean"
        },
        "sources": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Text"
          },
          "minItems": 0
        },
        "source_revisions": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/OID"
          },
          "minItems": 0
        }
      },
      "required": [],
      "additionalProperties": false
    },
    "SearchInput": {
      "type": "object",
      "properties": {
        "query": {
          "$ref": "#/$defs/Text"
        },
        "limit": {
          "type": "integer",
          "minimum": 1
        },
        "filters": {
          "$ref": "#/$defs/Filters"
        }
      },
      "required": [
        "query",
        "limit"
      ],
      "additionalProperties": false
    },
    "SearchOutput": {
      "type": "object",
      "properties": {
        "ok": {
          "const": true
        },
        "result": {
          "type": "array",
          "items": {
            "allOf": [
              {
                "$ref": "#/$defs/Link"
              },
              {
                "required": [
                  "lines"
                ]
              }
            ]
          },
          "minItems": 0
        },
        "warnings": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Diagnostic"
          },
          "minItems": 1,
          "description": "D-95: non-fatal warnings of this call (drain not started); not stored. The last query-embedding error is a status problem (D-62)."
        }
      },
      "required": [
        "ok",
        "result"
      ],
      "additionalProperties": false
    },
    "TraverseInput": {
      "type": "object",
      "properties": {
        "element_ids": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/ElementId"
          },
          "minItems": 1
        },
        "mode": {
          "enum": [
            "relations",
            "containment",
            "both"
          ]
        },
        "direction": {
          "enum": [
            "outgoing",
            "incoming",
            "both"
          ]
        },
        "depth": {
          "type": "integer",
          "minimum": 0
        },
        "limit": {
          "type": "integer",
          "minimum": 1
        },
        "edge_types": {
          "type": "array",
          "items": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9_]*(?![\\s\\S])"
          },
          "minItems": 0
        },
        "edge_limit": {
          "type": "integer",
          "minimum": 1
        }
      },
      "required": [
        "element_ids",
        "mode",
        "direction",
        "depth",
        "limit"
      ],
      "additionalProperties": false
    },
    "Edge": {
      "type": "object",
      "properties": {
        "source": {
          "$ref": "#/$defs/KnowledgeId"
        },
        "target": {
          "$ref": "#/$defs/ElementId"
        },
        "type": {
          "type": "string",
          "pattern": "^[a-z][a-z0-9_]*(?![\\s\\S])"
        }
      },
      "required": [
        "source",
        "target",
        "type"
      ],
      "additionalProperties": false,
      "description": "D-93: an edge is the triple (source, target, type); no edge ID or created_at."
    },
    "TraverseOutput": {
      "type": "object",
      "properties": {
        "ok": {
          "const": true
        },
        "result": {
          "type": "object",
          "properties": {
            "elements": {
              "type": "array",
              "items": {
                "$ref": "#/$defs/Link"
              },
              "minItems": 0
            },
            "edges": {
              "type": "array",
              "items": {
                "$ref": "#/$defs/Edge"
              },
              "minItems": 0
            }
          },
          "required": [
            "elements"
          ],
          "additionalProperties": false
        },
        "warnings": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Diagnostic"
          },
          "minItems": 1,
          "description": "D-95: non-fatal warnings of this call (drain not started); not stored. The last query-embedding error is a status problem (D-62)."
        }
      },
      "required": [
        "ok",
        "result"
      ],
      "additionalProperties": false
    },
    "ReindexOutput": {
      "type": "object",
      "properties": {
        "ok": {
          "const": true
        },
        "result": {
          "type": "object",
          "properties": {
            "revision": {
              "$ref": "#/$defs/Revision"
            }
          },
          "required": [
            "revision"
          ],
          "additionalProperties": false
        },
        "warnings": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Diagnostic"
          },
          "minItems": 1,
          "description": "D-95: non-fatal warnings of this call (drain not started); not stored. The last query-embedding error is a status problem (D-62)."
        }
      },
      "required": [
        "ok",
        "result"
      ],
      "additionalProperties": false
    },
    "Lock": {
      "type": "object",
      "properties": {
        "name": {
          "enum": [
            "index",
            "embed"
          ]
        },
        "pid": {
          "type": "integer",
          "minimum": 1
        }
      },
      "required": [
        "name",
        "pid"
      ],
      "additionalProperties": false,
      "description": "D-94: a held flock on .letopis/index.lock (publication/reindex) or .letopis/embed.lock (embedding drain) and the PID recorded by its holder."
    },
    "StatusOutput": {
      "type": "object",
      "properties": {
        "ok": {
          "const": true
        },
        "result": {
          "type": "object",
          "properties": {
            "revision": {
              "anyOf": [
                {
                  "$ref": "#/$defs/Revision"
                },
                {
                  "type": "null"
                }
              ]
            },
            "embedding_backlog": {
              "type": "integer",
              "minimum": 0
            },
            "embedding_failed": {
              "type": "integer",
              "minimum": 0
            },
            "locks": {
              "type": "array",
              "items": {
                "$ref": "#/$defs/Lock"
              },
              "minItems": 0
            },
            "problems": {
              "type": "array",
              "items": {
                "$ref": "#/$defs/Diagnostic"
              },
              "minItems": 0
            }
          },
          "required": [
            "revision",
            "embedding_backlog",
            "embedding_failed",
            "locks",
            "problems"
          ],
          "additionalProperties": false,
          "description": "D-95: current state only. problems = invalid files, dangling links, includes cycles, exhausted embedding attempts, invalid config.json; no history or lifecycle flag."
        },
        "warnings": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Diagnostic"
          },
          "minItems": 1,
          "description": "D-95: non-fatal warnings of this call (drain not started); not stored. The last query-embedding error is a status problem (D-62)."
        }
      },
      "required": [
        "ok",
        "result"
      ],
      "additionalProperties": false
    },
    "Parameters": {
      "type": "object",
      "properties": {
        "base_url": {
          "type": "string",
          "format": "uri",
          "pattern": "^https?://"
        }
      },
      "propertyNames": {
        "not": {
          "enum": [
            "api_key",
            "authorization",
            "Authorization"
          ]
        }
      },
      "additionalProperties": true,
      "description": "Provider settings; base_url is client-only, credentials forbidden. Host/path validation is semantic.",
      "required": [
        "base_url"
      ]
    },
    "Configuration": {
      "type": "object",
      "properties": {
        "provider": {
          "enum": [
            "ollama",
            "openai"
          ]
        },
        "model": {
          "$ref": "#/$defs/Text"
        },
        "parameters": {
          "$ref": "#/$defs/Parameters"
        },
        "max_retries": {
          "type": "integer",
          "minimum": 0,
          "description": "Additional attempts after the initial embedding attempt; letopis setting, not provider request data."
        }
      },
      "required": [
        "provider",
        "model",
        "parameters",
        "max_retries"
      ],
      "additionalProperties": false,
      "description": "D-95: content of .letopis/config.json, edited as a file; read by config."
    },
    "ConfigOutput": {
      "type": "object",
      "properties": {
        "ok": {
          "const": true
        },
        "result": {
          "anyOf": [
            {
              "$ref": "#/$defs/Configuration"
            },
            {
              "type": "null"
            }
          ]
        },
        "warnings": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Diagnostic"
          },
          "minItems": 1,
          "description": "D-95: non-fatal warnings of this call (drain not started); not stored. The last query-embedding error is a status problem (D-62)."
        }
      },
      "required": [
        "ok",
        "result"
      ],
      "additionalProperties": false
    },
    "SourceId": {
      "type": "string",
      "pattern": "^(?!/)[^\\x00-\\x1f#]+(?:#L[1-9][0-9]*-L[1-9][0-9]*)?(?![\\s\\S])",
      "description": "D-91: a source's ID is its normalized address: a whole file or path#Lstart-Lend. end >= start is checked by the application. A path is either a corpus element or a source; the application resolves which."
    },
    "ElementId": {
      "anyOf": [
        {
          "$ref": "#/$defs/KnowledgeId"
        },
        {
          "$ref": "#/$defs/SourceId"
        }
      ],
      "description": "Knowledge (path or path#anchor) or source (path or path#Lx-Ly) ID. No UUIDs (D-93)."
    },
    "KnowledgeId": {
      "type": "string",
      "pattern": "^(?!/)[^\\x00-\\x1f#]+\\.(?:md|markdown)(?:#(?!L[0-9]+-L[0-9]+(?![\\s\\S]))[A-Za-z][A-Za-z0-9_-]*)?(?![\\s\\S])",
      "description": "D-93: a knowledge element's ID is its file path relative to the Git root, or path#anchor for a section element. The anchor is explicit, unique within the file and not shaped like L<n>-L<n>."
    },
    "CheckInput": {
      "type": "object",
      "properties": {
        "paths": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Path"
          },
          "minItems": 0
        }
      },
      "required": [],
      "additionalProperties": false,
      "description": "Empty or missing paths = whole corpus. Never writes files (D-93)."
    },
    "Revision": {
      "type": "integer",
      "minimum": 0,
      "description": "D-95: counter of index publications; not a Git OID."
    },
    "EmptyOutput": {
      "type": "object",
      "properties": {
        "ok": {
          "const": true
        },
        "result": {
          "$ref": "#/$defs/Empty"
        },
        "warnings": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Diagnostic"
          },
          "minItems": 1,
          "description": "D-95: non-fatal warnings of this call (drain not started); not stored. The last query-embedding error is a status problem (D-62)."
        }
      },
      "required": [
        "ok",
        "result"
      ],
      "additionalProperties": false
    }
  },
  "anyOf": [
    {
      "$ref": "#/$defs/Failure"
    },
    {
      "$ref": "#/$defs/ConfigOutput"
    },
    {
      "$ref": "#/$defs/Empty"
    },
    {
      "$ref": "#/$defs/Configuration"
    },
    {
      "$ref": "#/$defs/InspectInput"
    },
    {
      "$ref": "#/$defs/ReindexOutput"
    },
    {
      "$ref": "#/$defs/CheckOutput"
    },
    {
      "$ref": "#/$defs/StatusOutput"
    },
    {
      "$ref": "#/$defs/SearchOutput"
    },
    {
      "$ref": "#/$defs/TraverseInput"
    },
    {
      "$ref": "#/$defs/TraverseOutput"
    },
    {
      "$ref": "#/$defs/SearchInput"
    },
    {
      "$ref": "#/$defs/InspectOutput"
    },
    {
      "$ref": "#/$defs/CheckInput"
    },
    {
      "$ref": "#/$defs/EmptyOutput"
    }
  ],
  "x-commands": {
    "check": {
      "input": {
        "$ref": "#/$defs/CheckInput"
      },
      "success": {
        "$ref": "#/$defs/CheckOutput"
      },
      "error": {
        "$ref": "#/$defs/Failure"
      },
      "x-idempotency": "natural",
      "description": "Validate the corpus or given paths; never writes files.",
      "stdout": "one JSON",
      "exit": {
        "success": 0,
        "error": 1
      }
    },
    "inspect": {
      "input": {
        "$ref": "#/$defs/InspectInput"
      },
      "success": {
        "$ref": "#/$defs/InspectOutput"
      },
      "error": {
        "$ref": "#/$defs/Failure"
      },
      "x-idempotency": "natural",
      "description": "Read current metadata; snapshot OID can vary with corpus.",
      "stdout": "one JSON",
      "exit": {
        "success": 0,
        "error": 1
      }
    },
    "search": {
      "input": {
        "$ref": "#/$defs/SearchInput"
      },
      "success": {
        "$ref": "#/$defs/SearchOutput"
      },
      "error": {
        "$ref": "#/$defs/Failure"
      },
      "x-idempotency": "natural",
      "description": "Read; hybrid with FTS fallback; no timed truncation.",
      "stdout": "one JSON",
      "exit": {
        "success": 0,
        "error": 1
      }
    },
    "traverse": {
      "input": {
        "$ref": "#/$defs/TraverseInput"
      },
      "success": {
        "$ref": "#/$defs/TraverseOutput"
      },
      "error": {
        "$ref": "#/$defs/Failure"
      },
      "x-idempotency": "natural",
      "description": "Read one published state; starting nodes excluded.",
      "stdout": "one JSON",
      "exit": {
        "success": 0,
        "error": 1
      }
    },
    "reindex": {
      "input": {
        "$ref": "#/$defs/Empty"
      },
      "success": {
        "$ref": "#/$defs/ReindexOutput"
      },
      "error": {
        "$ref": "#/$defs/Failure"
      },
      "x-idempotency": "none",
      "description": "Full rebuild under index.lock (D-95); waits graph/FTS publication, not vectors; SIGINT cancels, the previous cache stays.",
      "stdout": "one JSON",
      "exit": {
        "success": 0,
        "error": 1
      }
    },
    "status": {
      "input": {
        "$ref": "#/$defs/Empty"
      },
      "success": {
        "$ref": "#/$defs/StatusOutput"
      },
      "error": {
        "$ref": "#/$defs/Failure"
      },
      "x-idempotency": "natural",
      "description": "Read current state: revision, embedding backlog/failed, held locks, current problems (D-95).",
      "stdout": "one JSON",
      "exit": {
        "success": 0,
        "error": 1
      }
    },
    "config": {
      "input": {
        "$ref": "#/$defs/Empty"
      },
      "success": {
        "$ref": "#/$defs/ConfigOutput"
      },
      "error": {
        "$ref": "#/$defs/Failure"
      },
      "x-idempotency": "natural",
      "description": "Read .letopis/config.json; null before setup. Changed by editing the file (D-95).",
      "stdout": "one JSON",
      "exit": {
        "success": 0,
        "error": 1
      }
    },
    "embed --drain": {
      "input": {
        "$ref": "#/$defs/Empty"
      },
      "success": {
        "$ref": "#/$defs/EmptyOutput"
      },
      "error": {
        "$ref": "#/$defs/Failure"
      },
      "x-idempotency": "safe-retry",
      "x-internal": true,
      "description": "Internal, not for agents (D-94/D-95): detached drain under embed.lock of texts without a vector; exits 0 with an empty result when no work is left or another drain holds the lock.",
      "stdout": "one JSON",
      "exit": {
        "success": 0,
        "error": 1
      }
    }
  }
}
