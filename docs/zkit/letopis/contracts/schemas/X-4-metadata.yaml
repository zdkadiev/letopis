{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:letopis:contracts:markdown-metadata:v1",
  "title": "letopis metadata inside Markdown, not whole-Markdown parser",
  "x-boundary": "X-4",
  "x-direction": "published",
  "x-status": "draft",
  "x-serves": [
    "FR-3",
    "FR-4",
    "FR-5",
    "FR-6",
    "FR-18",
    "FR-19",
    "FR-35"
  ],
  "x-limits": [],
  "$defs": {
    "canonical": {
      "type": "object",
      "properties": {
        "created_at": {
          "type": "integer",
          "minimum": 0
        },
        "source_snapshot": {
          "type": "string",
          "pattern": "^(?:[0-9a-f]{40}|[0-9a-f]{64})(?![\\s\\S])"
        }
      },
      "required": [
        "created_at"
      ],
      "additionalProperties": false,
      "description": "D-93/D-95: metadata of one element, written by the agent in <!-- letopis: {...} --> right after the element's heading (section element) or as the file's first line (whole-file element). The ID is not stored: it is the path or path#anchor. No kind: a metavertex is an element with outgoing includes."
    },
    "edgeTitle": {
      "type": "string",
      "pattern": "^letopis:type=[a-z][a-z0-9_]*(?![\\s\\S])",
      "description": "D-93: edge = (containing element, link target, type); no edge ID or created_at."
    }
  },
  "$ref": "#/$defs/canonical",
  "examples": [
    {
      "created_at": 1792285200
    },
    {
      "created_at": 1792285200,
      "source_snapshot": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    }
  ]
}
