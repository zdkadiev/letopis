{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "x-boundary": "I-1",
  "x-direction": "internal",
  "x-status": "draft",
  "x-interfaces": [
    "I-1",
    "I-3",
    "I-5",
    "I-6"
  ],
  "description": "NDJSON over one local Unix stream. Handshake then one request, optionally one cancellation frame, then one X-1 response. CLI stdin/stdout remain unchanged. Never replay a sent mutation.",
  "$defs": {
    "Handshake": {
      "type": "object",
      "properties": {
        "protocol": {
          "const": 1
        },
        "root": {
          "type": "string",
          "minLength": 1
        }
      },
      "required": [
        "protocol",
        "root"
      ],
      "additionalProperties": false
    },
    "Request": {
      "oneOf": [
        {
          "type": "object",
          "properties": {
            "command": {
              "const": "apply"
            },
            "input": {
              "$ref": "schemas/X-1-cli.yaml#/$defs/ApplyInput"
            }
          },
          "required": [
            "command",
            "input"
          ],
          "additionalProperties": false
        },
        {
          "type": "object",
          "properties": {
            "command": {
              "const": "apply --check"
            },
            "input": {
              "$ref": "schemas/X-1-cli.yaml#/$defs/ApplyInput"
            }
          },
          "required": [
            "command",
            "input"
          ],
          "additionalProperties": false
        },
        {
          "type": "object",
          "properties": {
            "command": {
              "const": "inspect"
            },
            "input": {
              "$ref": "schemas/X-1-cli.yaml#/$defs/InspectInput"
            }
          },
          "required": [
            "command",
            "input"
          ],
          "additionalProperties": false
        },
        {
          "type": "object",
          "properties": {
            "command": {
              "const": "search"
            },
            "input": {
              "$ref": "schemas/X-1-cli.yaml#/$defs/SearchInput"
            }
          },
          "required": [
            "command",
            "input"
          ],
          "additionalProperties": false
        },
        {
          "type": "object",
          "properties": {
            "command": {
              "const": "traverse"
            },
            "input": {
              "$ref": "schemas/X-1-cli.yaml#/$defs/TraverseInput"
            }
          },
          "required": [
            "command",
            "input"
          ],
          "additionalProperties": false
        },
        {
          "type": "object",
          "properties": {
            "command": {
              "const": "reindex"
            },
            "input": {
              "$ref": "schemas/X-1-cli.yaml#/$defs/ReindexInput"
            }
          },
          "required": [
            "command",
            "input"
          ],
          "additionalProperties": false
        },
        {
          "type": "object",
          "properties": {
            "command": {
              "const": "reindex --cancel"
            },
            "input": {
              "$ref": "schemas/X-1-cli.yaml#/$defs/Empty"
            }
          },
          "required": [
            "command",
            "input"
          ],
          "additionalProperties": false
        },
        {
          "type": "object",
          "properties": {
            "command": {
              "const": "status"
            },
            "input": {
              "$ref": "schemas/X-1-cli.yaml#/$defs/Empty"
            }
          },
          "required": [
            "command",
            "input"
          ],
          "additionalProperties": false
        },
        {
          "type": "object",
          "properties": {
            "command": {
              "const": "errors"
            },
            "input": {
              "$ref": "schemas/X-1-cli.yaml#/$defs/Empty"
            }
          },
          "required": [
            "command",
            "input"
          ],
          "additionalProperties": false
        },
        {
          "type": "object",
          "properties": {
            "command": {
              "const": "errors --clear"
            },
            "input": {
              "$ref": "schemas/X-1-cli.yaml#/$defs/Empty"
            }
          },
          "required": [
            "command",
            "input"
          ],
          "additionalProperties": false
        },
        {
          "type": "object",
          "properties": {
            "command": {
              "const": "config"
            },
            "input": {
              "$ref": "schemas/X-1-cli.yaml#/$defs/Empty"
            }
          },
          "required": [
            "command",
            "input"
          ],
          "additionalProperties": false
        },
        {
          "type": "object",
          "properties": {
            "command": {
              "const": "config --set"
            },
            "input": {
              "$ref": "schemas/X-1-cli.yaml#/$defs/Configuration"
            }
          },
          "required": [
            "command",
            "input"
          ],
          "additionalProperties": false
        }
      ]
    },
    "Cancel": {
      "type": "object",
      "properties": {
        "cancel": {
          "const": true
        }
      },
      "required": [
        "cancel"
      ],
      "additionalProperties": false
    },
    "Response": {
      "anyOf": [
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/ApplyOutput"
        },
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/CheckOutput"
        },
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/InspectOutput"
        },
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/SearchOutput"
        },
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/TraverseOutput"
        },
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/ReindexOutput"
        },
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/CancelOutput"
        },
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/StatusOutput"
        },
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/ErrorsOutput"
        },
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/ErrorsOutput"
        },
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/ConfigOutput"
        },
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/ConfigSetOutput"
        },
        {
          "$ref": "schemas/X-1-cli.yaml#/$defs/Failure"
        }
      ]
    }
  },
  "oneOf": [
    {
      "$ref": "#/$defs/Handshake"
    },
    {
      "$ref": "#/$defs/Request"
    },
    {
      "$ref": "#/$defs/Cancel"
    },
    {
      "$ref": "#/$defs/Response"
    }
  ]
}
