[package]
name = "letopis"
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[dependencies]
libc = "=0.2.191"
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std"] }
sea-query = { version = "=1.0.2", default-features = false, features = ["backend-sqlite", "derive"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
libsqlite3-sys = { version = "=0.38.2", default-features = false, features = ["bundled"] }
sha1-checked = "=0.10.0"
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier", "json"] }
serde_json_canonicalizer = "=0.3.2"
pulldown-cmark = { version = "=0.13.4", default-features = false }
signal-hook = "=0.3.18"

# Keep compiler diagnostics strict for every root-crate target.
[lints.rust]
warnings = "deny"
missing_debug_implementations = "warn"

# Standard Clippy checks, with explicit bans on debug output and unfinished code.
[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
too_many_lines = "warn"

# Selected pedantic checks: catch lossy casts before they silently change values.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"

# Make cloning and ownership choices explicit; avoid unnecessary allocations.
implicit_clone = "warn"
inefficient_to_string = "warn"
needless_pass_by_value = "warn"

# Prefer direct method references and clear, consistent control flow.
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"

# Explain public failure/panic contracts and flag ignored Self-returning results.
doc_markdown = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
return_self_not_must_use = "warn"

[build-dependencies]
cc = "=1.9.0"
sha2 = "=0.10.9"

[dev-dependencies]
mockall = "=0.15.0"
# Private filesystem watchdogs terminate their owned process groups.
rustix = { version = "=1.1.5", default-features = false, features = ["process", "std"] }
tempfile = "=3.23.0"

# Distribution build: `make release`. Kept separate from `release` so `make verify` stays fast.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
