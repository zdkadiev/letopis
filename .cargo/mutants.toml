# Exact equivalent operators only; proofs and assumptions: TK-16 contention plan.
# Recheck on native-stack, platform, command-inventory, config-schema or path-policy changes.
# Hex nibbles and constant permission/open flags have disjoint bits: OR == XOR.
# Existing read-only hash-object calls gain only fsync config; writing calls stay hardened.
# Canonical absolute Unix filenames decode identically after all-byte URI encoding.
# Locked bundled SQLite 3.53.2 makes both mutated version comparisons false.
# Duplicate-free config requires every one of its four allowed root keys.
exclude_re = [
    "^src/domain/sha256\\.rs:23:46: replace \\| with \\^ in Sha256::parse$",
